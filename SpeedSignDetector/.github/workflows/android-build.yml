name: Android Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'claude/**'
    paths:
      - 'SpeedSignDetector/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'SpeedSignDetector/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: SpeedSignDetector
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: SpeedSignDetector
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: SpeedSignDetector
        run: ./gradlew assembleRelease --no-daemon

      - name: Run Unit Tests
        working-directory: SpeedSignDetector
        run: ./gradlew test --no-daemon
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: SpeedSignDetector/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: SpeedSignDetector/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: SpeedSignDetector/app/build/reports/tests/
          retention-days: 7

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: SpeedSignDetector
        run: chmod +x gradlew

      - name: Run Lint
        working-directory: SpeedSignDetector
        run: ./gradlew lint --no-daemon
        continue-on-error: true

      - name: Upload Lint Results
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: SpeedSignDetector/app/build/reports/lint-results*.html
          retention-days: 7
