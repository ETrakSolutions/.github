name: Android Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Download and setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Debug info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          gradle --version

      - name: Build Debug APK
        working-directory: SpeedSignDetector
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || (cat build.log && exit 1)

      - name: Build Release APK
        working-directory: SpeedSignDetector
        run: gradle assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Run Unit Tests
        working-directory: SpeedSignDetector
        run: gradle test --no-daemon
        continue-on-error: true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: SpeedSignDetector/build.log

      - name: List APK files
        run: find SpeedSignDetector -name "*.apk" -type f || echo "No APK found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedSignDetector-debug
          path: SpeedSignDetector/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedSignDetector-release
          path: SpeedSignDetector/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: SpeedSignDetector/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
