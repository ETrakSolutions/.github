name: Build PS3 Gamepad APK

on:
  push:
    branches: [main, ps3-gamepad-android]
    paths:
      - 'ps3-gamepad-test/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ps3-gamepad-test/gradlew

      - name: Download Gradle wrapper jar
        working-directory: ps3-gamepad-test
        run: |
          gradle wrapper --gradle-version 8.2

      - name: Build debug APK
        working-directory: ps3-gamepad-test
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS3GamepadTest-debug
          path: ps3-gamepad-test/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
